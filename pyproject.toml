[project]
name = "claimwise-ai"
version = "0.2.0"
description = "ClaimWise AI — Enterprise Copilot untuk Optimasi Triase Klaim & Alokasi Penjadwalan Verifikator Berbasis Algoritma Genetika (Genetic Algorithm - GA) Multi-Objektif"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Davina Olivia Yosefanny Hutabarat" },
    { name = "Pedro Simangunsong" },
    { name = "Jody Alfonso Siahaan" }
]
keywords = [
    "artificial-intelligence",
    "genetic-algorithm",
    "evolutionary-optimization",
    "memetic-algorithm",
    "multi-objective-optimization",
    "workforce-scheduling",
    "health-insurance",
    "state-space-search"
]
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false